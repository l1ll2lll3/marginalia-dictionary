app = "marginalia-dict"
primary_region = "nrt"

[build]

[env]
  DICT_DB_PATH = "/data/dict.db"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "dict_data"
  destination = "/data"
